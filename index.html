<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caption Quick</title>

<style>
body{
    font-family:Arial;
    background:#f4f4f4;
    margin:0;
    padding:15px;
}
.container{max-width:600px;margin:auto;}
.header{
    background:#1877f2;
    color:white;
    padding:15px;
    text-align:center;
    border-radius:10px;
    margin-bottom:15px;
}
.card{
    background:white;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}
input,select{
    width:100%;
    padding:10px;
    margin-top:8px;
    margin-bottom:10px;
}
button{
    width:100%;
    padding:12px;
    background:#1877f2;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}
.result{
    background:#f7f7f7;
    padding:10px;
    border-radius:8px;
    margin-top:10px;
}
.percent{
    font-size:40px;
    color:#28a745;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<h2>⚡ Caption Quick</h2>
<p>Test AI Post Generator</p>
</div>

<div class="card">
<input id="topic" type="text" placeholder="Enter your topic (e.g. AI Cars)">
<button onclick="generate()">Generate</button>
</div>

<div class="card">
<h3>🔥 Viral Score</h3>
<div class="percent" id="score">--%</div>
</div>

<div class="card">
<h3>🖼 Image Prompt</h3>
<div class="result" id="img">---</div>
</div>

<div class="card">
<h3>📰 Title</h3>
<div class="result" id="title">---</div>
</div>

<div class="card">
<h3>📄 Caption</h3>
<div class="result" id="caption">---</div>
</div>

<div class="card">
<h3># Hashtags</h3>
<div class="result" id="tags">---</div>
</div>

</div>

<script>
function generate(){

let topic = document.getElementById("topic").value;

if(topic===""){
alert("Enter a topic!");
return;
}

// fake AI logic (demo)
let score = Math.floor(Math.random()*40)+60;

document.getElementById("score").innerText = score + "%";

document.getElementById("img").innerText =
"A cinematic ultra realistic image of " + topic + ", trending social media style, high detail";

document.getElementById("title").innerText =
"Top Reasons Why " + topic + " is Going Viral in 2026";

document.getElementById("caption").innerText =
topic + " is becoming a global trend with massive engagement on social media platforms.";

document.getElementById("tags").innerText =
"#" + topic.replace(" ","") + " #Trending #Viral #AI #SocialMedia";

}
</script>

</body>
</html>
